name: 候选构建

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - '.github/actions/install-tauri-deps/**'
      - 'src/**'
      - 'src-isolation/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'vite.config.isolation.ts'

permissions:
  contents: read

jobs:
  bundle:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            args: ''
            artifact: windows-x64
            portable_architecture: x64
            release_directory: src-tauri/target/release
          - name: Windows ARM64
            runner: windows-11-arm
            args: '--target aarch64-pc-windows-msvc'
            artifact: windows-arm64
            portable_architecture: arm64
            release_directory: src-tauri/target/aarch64-pc-windows-msvc/release
          - name: Linux x64
            runner: ubuntu-24.04
            args: ''
            artifact: linux-x64
            portable_architecture: ''
            release_directory: ''
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            args: ''
            artifact: linux-arm64
            portable_architecture: ''
            release_directory: ''

    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TERM_COLOR: always
      TAURI_SKIP_UPDATE_CHECK: 1

    steps:
      - name: 检出代码
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 设置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: 安装 Linux 系统依赖
        if: startsWith(matrix.runner, 'ubuntu')
        uses: ./.github/actions/install-tauri-deps

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # rust-toolchain action
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.runner == 'windows-11-arm' && 'aarch64-pc-windows-msvc' || '' }}

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 cargo-about
        uses: taiki-e/install-action@0fde6d128a3d980ceac30be8c8b8739abd963b81 # v2
        with:
          tool: cargo-about

      - name: 安装前端依赖
        run: npm ci

      - name: 验证派生项目身份
        run: npm run verify:identity

      - name: 构建候选安装包
        run: npm run tauri build -- ${{ matrix.args }}

      - name: 列出 Linux 打包产物目录
        if: startsWith(matrix.runner, 'ubuntu')
        shell: bash
        run: |
          echo "--- bundle/deb 目录内容 ---"
          find src-tauri/target/release/bundle/deb -type f 2>/dev/null || echo "bundle/deb 不存在"
          echo "--- 所有 .deb 文件 ---"
          find src-tauri/target -name '*.deb' -type f 2>/dev/null || echo "未找到 .deb 文件"

      - name: 验证 Linux Deb 包身份
        if: startsWith(matrix.runner, 'ubuntu')
        shell: bash
        run: |
          ./scripts/verify-debian-package.sh \
            src-tauri/target/release/bundle/deb \
            '${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }}' \
            "$(node -p 'require("./package.json").version')"

      - name: 上传 Linux Deb 调试信息
        if: startsWith(matrix.runner, 'ubuntu') && failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}-deb-debug
          path: src-tauri/target/**/bundle/**/*.deb
          retention-days: 3

      - name: 生成 Windows 便携包
        if: matrix.portable_architecture != ''
        shell: pwsh
        run: |
          $version = node -p 'require("./package.json").version'
          ./scripts/build-portable.ps1 `
            -ReleaseDirectory '${{ matrix.release_directory }}' `
            -Architecture '${{ matrix.portable_architecture }}' `
            -Version $version

      - name: 上传候选安装包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/**/release/bundle/**
          if-no-files-found: error
          retention-days: 7
