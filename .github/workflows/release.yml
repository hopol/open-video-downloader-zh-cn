name: 发布派生版本

on:
  push:
    tags:
      - 'zh-cn-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的已存在标签（例如 zh-cn-v3.2.2）
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-release:
    name: 验证标签与版本
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: 检出发布代码
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: 设置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: 安装依赖以运行发布验证
        run: npm ci

      - name: 验证派生身份与版本
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          npm run verify:identity
          npm run verify:version -- "$RELEASE_TAG"

      - name: 确认发布尚不存在
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "发布 $TAG 已存在；为防止覆盖资产，工作流终止。"
            exit 1
          fi

      - name: 输出发布元数据
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: verify-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            args: ''
            artifact: windows-x64
            portable_architecture: x64
            release_directory: src-tauri/target/release
          - name: Windows ARM64
            runner: windows-11-arm
            args: '--target aarch64-pc-windows-msvc'
            artifact: windows-arm64
            portable_architecture: arm64
            release_directory: src-tauri/target/aarch64-pc-windows-msvc/release
          - name: Linux x64
            runner: ubuntu-24.04
            args: ''
            artifact: linux-x64
            portable_architecture: ''
            release_directory: ''
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            args: ''
            artifact: linux-arm64
            portable_architecture: ''
            release_directory: ''

    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TERM_COLOR: always
      TAURI_SKIP_UPDATE_CHECK: 1

    steps:
      - name: 检出发布标签
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.verify-release.outputs.tag }}

      - name: 设置 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: 安装 Linux 系统依赖
        if: startsWith(matrix.runner, 'ubuntu')
        uses: ./.github/actions/install-tauri-deps

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # rust-toolchain action
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.runner == 'windows-11-arm' && 'aarch64-pc-windows-msvc' || '' }}

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 cargo-about
        uses: taiki-e/install-action@0fde6d128a3d980ceac30be8c8b8739abd963b81 # v2
        with:
          tool: cargo-about

      - name: 安装前端依赖
        run: npm ci

      - name: 构建安装包
        run: npm run tauri build -- ${{ matrix.args }}

      - name: 列出 Linux 打包产物目录
        if: startsWith(matrix.runner, 'ubuntu')
        shell: bash
        run: |
          echo "--- bundle/deb 目录内容 ---"
          find src-tauri/target/release/bundle/deb -type f 2>/dev/null || echo "bundle/deb 不存在"
          echo "--- 所有 .deb 文件 ---"
          find src-tauri/target -name '*.deb' -type f 2>/dev/null || echo "未找到 .deb 文件"

      - name: 验证 Linux Deb 包身份
        if: startsWith(matrix.runner, 'ubuntu')
        shell: bash
        run: |
          ./scripts/verify-debian-package.sh \
            src-tauri/target/release/bundle/deb \
            '${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'amd64' }}' \
            '${{ needs.verify-release.outputs.version }}'

      - name: 生成 Windows 便携包
        if: matrix.portable_architecture != ''
        shell: pwsh
        run: |
          ./scripts/build-portable.ps1 `
            -ReleaseDirectory '${{ matrix.release_directory }}' `
            -Architecture '${{ matrix.portable_architecture }}' `
            -Version '${{ needs.verify-release.outputs.version }}'

      - name: 上传发布资产
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: error
          retention-days: 1

  publish:
    name: 创建草稿发布
    needs: [verify-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出发布标签
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.verify-release.outputs.tag }}

      - name: 下载全部构建产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets

      - name: 创建草稿发布并上传资产
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-release.outputs.tag }}
          VERSION: ${{ needs.verify-release.outputs.version }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## 发布说明

          这是独立维护的简体中文版本，不是上游官方发行。

          - 本版本未启用应用内自动更新；请从本发布页手动升级。
          - 本版本未启用应用内错误遥测。
          - 请在下载后使用 `SHA256SUMS.txt` 校验安装包完整性。
          - Windows 安装包在首期可能未使用代码签名，SmartScreen 警告不表示文件一定有害；请仅从此发布页下载并校验摘要。
          NOTES
          gh release create "$TAG" \
            --title "Open Video Downloader 简体中文维护版 $VERSION" \
            --draft \
            --notes-file release-notes.md
          staging=$(mktemp -d)
          for dir in release-assets/*/; do
            platform=$(basename "$dir")
            shopt -s globstar nullglob
            for f in "$dir"**/*; do
              [[ -f "$f" ]] || continue
              [[ -s "$f" ]] || continue
              case "$f" in
                *.deb|*.rpm|*.AppImage|*.exe|*.zip) ;;
                *) continue ;;
              esac
              filename=$(basename "$f")
              cp "$f" "$staging/${platform}_${filename}"
            done
          done
          find "$staging" -type f -print0 | sort -z | xargs -0 sha256sum > "$staging/SHA256SUMS.txt"
          gh release upload "$TAG" "$staging"/* --clobber
